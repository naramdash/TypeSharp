name: Publish NuGet On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish-main
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build, pack, smoke, and push TypeSharp.Tool
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: .\scripts\publish-nuget.ps1 -Push
